name: Release

# 推送 v* 标签时自动构建 Windows 安装包 + 便携版 zip，并创建 GitHub Release
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # Rust 增量缓存：首次 10-20 分钟，命中后大幅加速
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建（前端 + Tauri Release）
        run: pnpm tauri build

      - name: 收集产物
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force release | Out-Null
          # NSIS 安装包
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe |
            Copy-Item -Destination release
          # MSI（可选产物，存在才收）
          Get-ChildItem src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue |
            Copy-Item -Destination release
          # 便携版 zip（裸 exe；WebView2 在更新过的 Win10/11 上已内置）
          Compress-Archive -Path src-tauri/target/release/Pet.exe `
            -DestinationPath "release/Pet_${ver}_x64-portable.zip"
          Get-ChildItem release | Select-Object Name, Length

      - name: 创建 GitHub Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
